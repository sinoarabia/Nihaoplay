<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>NihaoPlay - Learn Chinese!</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --bg-color: #f7f9fc; --primary-color: #ff6b6b; --board-color: #4ecdc4; --text-color: #2d3748; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Comic Sans MS', 'Chalkboard SE', Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; overflow-x: hidden; }
        header { text-align: center; margin-bottom: 20px; width: 100%; position: relative; padding-top: 15px; }
        h1 { font-size: 2.5rem; color: var(--primary-color); margin-bottom: 5px; }
        .top-auth-group { position: absolute; top: 0px; right: 0px; display: flex; flex-direction: column; gap: 8px; }
        .login-top-btn { background: transparent; border: 2px solid; padding: 6px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.8rem; }
        .user-welcome { display: none; position: absolute; top: 0; right: 0; background: #fff; padding: 6px 12px; border-radius: 20px; border: 2px solid #e2e8f0; font-weight: bold; font-size: 0.85rem; }
        
        .middle-section { display: flex; align-items: center; justify-content: center; gap: 30px; width: 100%; max-width: 1000px; margin: 20px 0; }
        .nav-group { display: flex; flex-direction: column; gap: 20px; } 
        .side-nav-btn { background: #ffffff; border: 4px solid #333; border-radius: 20px; padding: 10px; font-size: 0.95rem; font-weight: bold; width: 160px; height: 85px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 5px 0px #333; }
        
        /* Characters (Always Free) */
        .stage { display: flex; justify-content: center; align-items: flex-end; gap: 40px; transform: scale(0.9); }
        .character { cursor: pointer; transition: 0.2s; }
        
        /* Board & Containers */
        .view-container { width: 100%; max-width: 900px; margin-bottom: 30px; border-radius: 20px; padding: 25px; }
        .pinyin-btn { background: #ffffff; border: 3px solid #333; border-radius: 12px; padding: 10px; font-size: 1.5rem; font-weight: bold; cursor: pointer; height: 60px; width: 70px; }
        
        @media (max-width: 850px) { .middle-section { flex-direction: column; } .nav-group { flex-direction: row; } }
    </style>
</head>
<body>
    <header>
        <div class="top-auth-group" id="authGroup">
            <button class="login-top-btn" style="border-color:#4ecdc4;color:#4ecdc4;" onclick="openModal('guestApplyModal')">Guest Login</button>
            <button class="login-top-btn" style="border-color:#ab47bc;color:#ab47bc;" onclick="openModal('vipLoginModal')">VIP Login</button>
        </div>
        <div class="user-welcome" id="userWelcome"><span id="welcomeName"></span> <button onclick="handleLogout()">Logout</button></div>
        <h1>NihaoPlay!</h1>
    </header><div class="middle-section">
        <div class="nav-group">
            <div class="side-nav-btn" style="border-color: #ff6b6b; color: #ff6b6b;" onclick="handlePinyinBtnClick()">
                <div class="top-tag tag-free">FREE</div>
                <i class="fas fa-language"></i><span>Chinese PinYin</span>
            </div>
            <div class="side-nav-btn" style="border-color: #f5af19; color: #f5af19;" onclick="handleBookTrialClick()">
                <div class="top-tag tag-free">FREE</div>
                <i class="fas fa-calendar-alt"></i><span>Book 1-on-1</span>
            </div>
        </div>

        <div class="stage">
            <div class="character" onclick="speakGreeting('baba', this, event)">
                <div class="boy-head" style="width: 60px; height: 60px; background: #ffe0b2; border-radius: 50%; border: 3px solid #333;"></div>
                <div style="font-size: 0.7rem; font-weight: bold;">爸爸 Baba</div>
            </div>
            <div class="character" onclick="speakGreeting('baby', this, event)">
                <div class="bao-head" style="width: 70px; height: 65px; background: #fff; border-radius: 50% 50% 45% 45%; border: 4px solid #333;"></div>
                <div style="font-size: 0.7rem; font-weight: bold;">宝宝 Baby</div>
            </div>
            <div class="character" onclick="speakGreeting('mama', this, event)">
                <div class="girl-head" style="width: 60px; height: 60px; background: #ffe0b2; border-radius: 50%; border: 3px solid #333;"></div>
                <div style="font-size: 0.7rem; font-weight: bold;">妈妈 Mama</div>
            </div>
        </div>

        <div class="nav-group">
            <div class="side-nav-btn" style="border-color: #ab47bc; color: #ab47bc;" onclick="handleVipCourseClick()">
                <div class="top-tag tag-vip">VIP</div>
                <i class="fas fa-chalkboard-teacher"></i><span>VIP Course</span>
            </div>
            <div class="side-nav-btn" style="border-color: #4ecdc4; color: #4ecdc4;" onclick="handleSongClick()">
                <div class="top-tag tag-vip">VIP</div>
                <i class="fas fa-music"></i><span>Song of CN/EN</span>
            </div>
        </div>
    </div><!-- Pinyin Board -->
    <div id="view-pinyin" class="view-container" style="display:none; background: #8d6e63; border: 8px solid #a1887f;">
        <div class="board">
            <button class="pinyin-btn" onclick="speakPinyin('ā', event)">ā</button>
            <button class="pinyin-btn" onclick="speakPinyin('b', event)">b</button>
            <!-- 在这里填入你所有的拼音按钮 -->
        </div>
    </div>

    <!-- Song Board -->
    <div id="view-songs" class="view-container" style="display:none; background: #e0f2fe; border: 8px solid #bae6fd;">
        <!-- 这里放入你那40首歌的完整 div 代码 -->
        <!-- 记得给每个 audio src 加上 ?v=20261 强制更新缓存 -->
        <div class="song-card" onclick="toggleAudio(this)">
            <i class="fas fa-compact-disc song-icon"></i>
            <div><div class="main-title">找朋友</div><div class="sub-title">Making Friends</div></div>
            <audio src="audio/song/找朋友.mp3?v=20261"></audio>
        </div>
        <!-- (重复上述结构填入所有歌曲) -->
    </div><script>
        let currentUser = null; 

        // 核心权限逻辑
        function handlePinyinBtnClick() {
            // 只要发送了资料(Guest) 或 是VIP 就可以播放
            if (!currentUser) { 
                alert("Please submit guest details to unlock Pinyin.");
                openModal('guestApplyModal'); 
                return; 
            }
            switchView('view-pinyin');
        }

        function handleSongClick() {
            if (currentUser?.role !== 'vip') {
                alert("VIP Only! Access Denied.");
                return;
            }
            switchView('view-songs');
        }

        // 处理发音：所有人(即使没登录)点击三个小人都可以直接发声
        function speakGreeting(character, element, event) {
            // 这里不需要 currentUser 检查
            new Audio(`audio/${character}.mp3?v=20261`).play().catch(e => console.log("Audio Error"));
            element.classList.add('cheer-anim');
            setTimeout(() => element.classList.remove('cheer-anim'), 800);
        }

        // 处理拼音播放：必须是 Guest 或 VIP 才能播放
        function speakPinyin(letter, event) {
            if (!currentUser) { alert("Please login first."); return; }
            new Audio(`audio/${letter}.mp3?v=20261`).play().catch(e => console.log("Audio Error"));
        }
        
        // ... (其他关闭弹窗、跳转逻辑保持一致) ...
    </script>
</body>
</html>
