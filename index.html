<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>NihaoPlay - Learn Full Pinyin!</title>
    
    <!-- 引入 FontAwesome 图标库 (用于显示 WhatsApp 的绿色电话图标) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --bg-color: #f7f9fc; --primary-color: #ff6b6b; --board-color: #4ecdc4; --text-color: #2d3748; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Comic Sans MS', 'Chalkboard SE', 'Microsoft YaHei', sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; align-items: center; justify-content: space-between; min-height: 100vh; overflow-x: hidden; padding: 20px; }
        header { text-align: center; margin-bottom: 10px; }
        h1 { font-size: 2.5rem; color: var(--primary-color); text-shadow: 2px 2px 0px #fff, 4px 4px 0px rgba(0,0,0,0.05); letter-spacing: 2px; }
        p.subtitle { font-size: 1.1rem; color: #718096; margin-top: 5px; }
        .stage { display: flex; justify-content: center; align-items: flex-end; gap: 40px; width: 100%; max-width: 600px; height: 220px; margin: 20px 0; position: relative; }
        .character { display: flex; flex-direction: column; align-items: center; position: relative; cursor: pointer; transition: transform 0.2s; }
        .character:hover { transform: scale(1.05); }
        @keyframes idle { 0%, 100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-8px) scaleY(1.02); } }
        @keyframes cheer { 0%, 100% { transform: translateY(0) scale(1); } 30% { transform: translateY(-45px) scale(0.9, 1.1); } 50% { transform: translateY(-50px) rotate(10deg); } 70% { transform: translateY(-50px) rotate(-10deg); } 85% { transform: translateY(-10px) scale(1.05, 0.95); } }
        .idle-anim { animation: idle 3s ease-in-out infinite; }
        .cheer-anim { animation: cheer 0.8s ease-in-out !important; }
        .boy-head { width: 70px; height: 70px; background: #ffe0b2; border-radius: 50%; position: relative; border: 3px solid #333; }
        .boy-cap { position: absolute; top: -12px; left: 5px; width: 60px; height: 25px; background: #29b6f6; border-radius: 40px 40px 0 0; border: 3px solid #333; }
        .boy-cap-brim { position: absolute; top: 5px; left: 45px; width: 25px; height: 8px; background: #ffca28; border-radius: 0 10px 10px 0; border: 3px solid #333; }
        .face-details { position: relative; top: 25px; display: flex; justify-content: space-around; padding: 0 10px; }
        .eye { width: 10px; height: 10px; background: #333; border-radius: 50%; }
        .smile { width: 24px; height: 12px; border: 3px solid #333; border-top: none; border-radius: 0 0 20px 20px; margin: 12px auto 0; }
        .boy-body { width: 55px; height: 60px; background: #29b6f6; border-radius: 15px 15px 5px 5px; border: 3px solid #333; margin-top: -3px; }
        .bao-head { width: 85px; height: 80px; background: #ffffff; border-radius: 50% 50% 45% 45%; position: relative; border: 4px solid #333; box-shadow: inset -5px -5px 0px rgba(0,0,0,0.05); }
        .bao-top { position: absolute; top: -14px; left: 32px; width: 20px; height: 20px; background: #ffffff; border-radius: 50% 50% 0 0; border: 3px solid #333; border-bottom: none; transform: rotate(45deg); }
        .bao-blush { position: absolute; top: 40px; width: 14px; height: 8px; background: #ff8a80; border-radius: 50%; opacity: 0.7; }
        .blush-left { left: 8px; } .blush-right { right: 8px; }
        .bao-smile { width: 20px; height: 10px; border: 3.5px solid #333; border-top: none; border-radius: 0 0 15px 15px; margin: 30px auto 0; }
        .bao-body { width: 45px; height: 25px; background: #ffffff; border-radius: 10px 10px 20px 20px; border: 4px solid #333; margin-top: -5px; }
        .girl-head { width: 70px; height: 70px; background: #ffe0b2; border-radius: 50%; position: relative; border: 3px solid #333; }
        .hair-bun { position: absolute; width: 28px; height: 28px; background: #ec407a; border-radius: 50%; border: 3px solid #333; top: -8px; }
        .bun-left { left: -8px; } .bun-right { right: -8px; }
        .girl-body { width: 55px; height: 60px; background: #ec407a; border-radius: 15px 15px 5px 5px; border: 3px solid #333; margin-top: -3px; }
        .char-name { background: #333; color: #fff; padding: 2px 10px; border-radius: 20px; font-size: 0.85rem; margin-top: 8px; font-weight: bold; letter-spacing: 1px; }
        .board-container { width: 100%; max-width: 900px; background: #8d6e63; padding: 15px 25px 30px 25px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.15), inset 0 -5px 0px rgba(0,0,0,0.2); border: 8px solid #a1887f; margin-bottom: 30px; }
        .category-wrapper { margin-bottom: 25px; }
        .category-title { background: rgba(0, 0, 0, 0.15); color: #fff; padding: 8px 20px; border-radius: 12px; margin: 15px 0 12px 0; font-size: 1.3rem; display: inline-block; border: 2px dashed rgba(255,255,255,0.3); }
        .board { background: var(--board-color); border-radius: 12px; padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 15px; border: 3px dashed rgba(255,255,255,0.4); }
        .pinyin-btn { background: #ffffff; border: 3px solid #333; border-radius: 16px; padding: 15px 5px; font-size: 2.2rem; font-weight: bold; color: var(--text-color); cursor: pointer; transition: all 0.15s; box-shadow: 0 6px 0px #333; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 85px; }
        .pinyin-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0px #333; background: #fff9db; }
        .pinyin-btn:active { transform: translateY(6px); box-shadow: 0 0px 0px #333; }
        .pinyin-btn span.base-letter { font-size: 1rem; color: #718096; margin-top: 5px; font-weight: bold; font-family: Arial, sans-serif; background-color: rgba(0,0,0,0.05); padding: 2px 12px; border-radius: 10px; }
        .bubble { position: absolute; background: rgba(255, 255, 255, 0.9); border: 3px solid #333; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: bold; pointer-events: none; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.1); animation: floatUp 1.2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards; }
        @keyframes floatUp { 0% { transform: translate(-50%, 0) scale(0.5); opacity: 1; } 100% { transform: translate(-50%, -150px) scale(1.2); opacity: 0; } }
        footer { margin-top: 10px; font-size: 0.9rem; color: #a0aec0; }

        /* --- 以下为新增的 WhatsApp 悬浮按钮样式 --- */
        .whatsapp-float-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            text-align: center;
        }
        .whatsapp-button {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 65px;
            height: 65px;
            background-color: #25d366;
            color: white;
            border-radius: 50%;
            text-decoration: none;
            font-size: 38px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
            margin-bottom: 12px;
        }
        .whatsapp-button:hover {
            transform: scale(1.1);
        }
        .whatsapp-text {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            color: #333;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            line-height: 1.5;
            font-family: Arial, sans-serif;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <header><h1>NihaoPlay!</h1><p class="subtitle">Click the letters to play & learn Chinese Pinyin!</p></header>
    <div class="stage">
        <div class="character idle-anim" id="boy" onclick="speakGreeting('baba', this, event)">
            <div class="boy-head"><div class="boy-cap"></div><div class="boy-cap-brim"></div><div class="face-details"><div class="eye"></div><div class="eye"></div></div><div class="smile"></div></div>
            <div class="boy-body"></div><div class="char-name">爸爸 Baba</div>
        </div>
        <div class="character idle-anim" id="bao" onclick="speakGreeting('baby', this, event)">
            <div class="bao-head"><div class="bao-top"></div><div class="bao-blush blush-left"></div><div class="bao-blush blush-right"></div><div class="face-details"><div class="eye"></div><div class="eye"></div></div><div class="bao-smile"></div></div>
            <div class="bao-body"></div><div class="char-name">宝宝 Baby</div>
        </div>
        <div class="character idle-anim" id="girl" onclick="speakGreeting('mama', this, event)">
            <div class="girl-head"><div class="hair-bun bun-left"></div><div class="hair-bun bun-right"></div><div class="face-details"><div class="eye"></div><div class="eye"></div></div><div class="smile"></div></div>
            <div class="girl-body"></div><div class="char-name">妈妈 Mama</div>
        </div>
    </div>
    <div class="board-container">
        <div class="category-wrapper"><div class="category-title">🎈 单韵母</div><div class="board">
            <button class="pinyin-btn" onclick="speakPinyin('ā', event)">ā<span class="base-letter">a</span></button><button class="pinyin-btn" onclick="speakPinyin('ō', event)">ō<span class="base-letter">o</span></button><button class="pinyin-btn" onclick="speakPinyin('ē', event)">ē<span class="base-letter">e</span></button><button class="pinyin-btn" onclick="speakPinyin('ī', event)">ī<span class="base-letter">i</span></button><button class="pinyin-btn" onclick="speakPinyin('ū', event)">ū<span class="base-letter">u</span></button><button class="pinyin-btn" onclick="speakPinyin('ǖ', event)">ǖ<span class="base-letter">ü</span></button>
        </div></div>
        <div class="category-wrapper"><div class="category-title">🚂 声母</div><div class="board">
            <button class="pinyin-btn" onclick="speakPinyin('b', event)">b</button><button class="pinyin-btn" onclick="speakPinyin('p', event)">p</button><button class="pinyin-btn" onclick="speakPinyin('m', event)">m</button><button class="pinyin-btn" onclick="speakPinyin('f', event)">f</button><button class="pinyin-btn" onclick="speakPinyin('d', event)">d</button><button class="pinyin-btn" onclick="speakPinyin('t', event)">t</button><button class="pinyin-btn" onclick="speakPinyin('n', event)">n</button><button class="pinyin-btn" onclick="speakPinyin('l', event)">l</button><button class="pinyin-btn" onclick="speakPinyin('g', event)">g</button><button class="pinyin-btn" onclick="speakPinyin('k', event)">k</button><button class="pinyin-btn" onclick="speakPinyin('h', event)">h</button><button class="pinyin-btn" onclick="speakPinyin('j', event)">j</button><button class="pinyin-btn" onclick="speakPinyin('q', event)">q</button><button class="pinyin-btn" onclick="speakPinyin('x', event)">x</button><button class="pinyin-btn" onclick="speakPinyin('zh', event)">zh</button><button class="pinyin-btn" onclick="speakPinyin('ch', event)">ch</button><button class="pinyin-btn" onclick="speakPinyin('sh', event)">sh</button><button class="pinyin-btn" onclick="speakPinyin('r', event)">r</button><button class="pinyin-btn" onclick="speakPinyin('z', event)">z</button><button class="pinyin-btn" onclick="speakPinyin('c', event)">c</button><button class="pinyin-btn" onclick="speakPinyin('s', event)">s</button><button class="pinyin-btn" onclick="speakPinyin('y', event)">y</button><button class="pinyin-btn" onclick="speakPinyin('w', event)">w</button>
        </div></div>
        <div class="category-wrapper"><div class="category-title">🧩 复韵母</div><div class="board">
            <button class="pinyin-btn" onclick="speakPinyin('ai', event)">ai</button><button class="pinyin-btn" onclick="speakPinyin('ei', event)">ei</button><button class="pinyin-btn" onclick="speakPinyin('ui', event)">ui</button><button class="pinyin-btn" onclick="speakPinyin('ao', event)">ao</button><button class="pinyin-btn" onclick="speakPinyin('ou', event)">ou</button><button class="pinyin-btn" onclick="speakPinyin('iu', event)">iu</button><button class="pinyin-btn" onclick="speakPinyin('ie', event)">ie</button><button class="pinyin-btn" onclick="speakPinyin('üe', event)">üe</button><button class="pinyin-btn" onclick="speakPinyin('er', event)">er</button>
        </div></div>
        <div class="category-wrapper"><div class="category-title">🐘 鼻韵母</div><div class="board">
            <button class="pinyin-btn" onclick="speakPinyin('an', event)">an</button><button class="pinyin-btn" onclick="speakPinyin('en', event)">en</button><button class="pinyin-btn" onclick="speakPinyin('in', event)">in</button><button class="pinyin-btn" onclick="speakPinyin('un', event)">un</button><button class="pinyin-btn" onclick="speakPinyin('ün', event)">ün</button><button class="pinyin-btn" onclick="speakPinyin('ang', event)">ang</button><button class="pinyin-btn" onclick="speakPinyin('eng', event)">eng</button><button class="pinyin-btn" onclick="speakPinyin('ing', event)">ing</button><button class="pinyin-btn" onclick="speakPinyin('ong', event)">ong</button>
        </div></div>
    </div>
    <footer>&copy; 2026 nihaoplay.com - All Rights Reserved.</footer>

    <!-- --- 以下为新增的 WhatsApp 悬浮按钮容器 --- -->
    <div class="whatsapp-float-container">
        <!-- 务必将下方的 962xxxxxxxx 替换为你的真实 WhatsApp 手机号 -->
        <a href="https://wa.me/962771128288" target="_blank" class="whatsapp-button">
            <i class="fab fa-whatsapp"></i>
        </a>
        <div class="whatsapp-text">
            <span>点击我开始真人视频一对一对话</span><br>
            <span>Click here to start a 1-on-1 live video chat</span><br>
            <span dir="rtl" style="display: block; font-family: 'Arial', sans-serif;">اضغط هنا لبدء مكالمة فيديو مباشرة وجهاً لوجه</span>
        </div>
    </div>

    <script>
        function speakGreeting(character, element, event) {
            if (event) event.stopPropagation();
            let audioUrl = "";
            const t = new Date().getTime(); 
            
            if (character === 'baba') { 
                audioUrl = `audio/baba.mp3?t=${t}`; 
            } else if (character === 'mama') { 
                audioUrl = `audio/mama.mp3?t=${t}`; 
            } else if (character === 'baby') { 
                audioUrl = `audio/baobao.mp3?t=${t}`; 
            }
            
            new Audio(audioUrl).play().catch(e => console.log("音频播放失败，请检查文件名", e));
            element.classList.remove('idle-anim'); element.classList.add('cheer-anim');
            setTimeout(() => { element.classList.remove('cheer-anim'); element.classList.add('idle-anim'); }, 800);
        }

        function speakPinyin(letter, event) {
            if (event) event.stopPropagation();
            const pinyinAudioMap = {
                'ā': 'a1', 'ō': 'o1', 'ē': 'e1', 'ī': 'yi1', 'ū': 'wu1', 'ǖ': 'yu1',
                'b': 'bo1', 'p': 'po1', 'm': 'mo1', 'f': 'fo1', 'd': 'de1', 't': 'te1', 'n': 'ne1', 'l': 'le1',
                'g': 'ge1', 'k': 'ke1', 'h': 'he1', 'j': 'ji1', 'q': 'qi1', 'x': 'xi1',
                'zh': 'zhi1', 'ch': 'chi1', 'sh': 'shi1', 'r': 'ri1', 'z': 'zi1', 'c': 'ci1', 's': 'si1',
                'y': 'yi1', 'w': 'wu1', 'ai': 'ai1', 'ei': 'ei1', 'ui': 'wei1', 'ao': 'ao1', 'ou': 'ou1', 
                'iu': 'you1', 'ie': 'ye1', 'üe': 'yue1', 'er': 'er2', 'an': 'an1', 'en': 'en1', 'in': 'yin1', 
                'un': 'wen1', 'ün': 'yun1', 'ang': 'ang1', 'eng': 'eng1', 'ing': 'ying1', 'ong': 'weng1'
            };
            const file = pinyinAudioMap[letter];
            if (file) { new Audio(`audio/${file}.mp3`).play().catch(e => console.log("本地音频读取失败", e)); }
            makeCheer(); if (event && event.clientX && event.clientY) createBubble(letter, event.clientX, event.clientY);
        }

        function makeCheer() { document.querySelectorAll('.character').forEach(char => { char.classList.remove('idle-anim'); char.classList.add('cheer-anim'); setTimeout(() => { char.classList.remove('cheer-anim'); char.classList.add('idle-anim'); }, 800); }); }
        function createBubble(text, x, y) {
            const colors = ['#ff6b6b', '#4ecdc4', '#ffe0b2', '#ec407a', '#29b6f6', '#ab47bc'];
            const bubble = document.createElement('div'); bubble.classList.add('bubble'); bubble.innerText = text;
            bubble.style.left = `${x}px`; bubble.style.top = `${y}px`; bubble.style.borderColor = colors[Math.floor(Math.random() * colors.length)];
            document.body.appendChild(bubble); bubble.addEventListener('animationend', () => bubble.remove());
        }
    </script>
</body>
</html>
