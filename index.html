<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NihaoPlay - Learn Pinyin!</title>
    <style>
        :root {
            --bg-color: #f7f9fc;
            --primary-color: #ff6b6b;
            --board-color: #4ecdc4;
            --text-color: #2d3748;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px;
        }

        /* 顶部标题栏 */
        header {
            text-align: center;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 2.5rem;
            color: var(--primary-color);
            text-shadow: 2px 2px 0px #fff, 4px 4px 0px rgba(0,0,0,0.05);
            letter-spacing: 2px;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: #718096;
            margin-top: 5px;
        }

        /* 动画人物区域 */
        .stage {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 40px;
            width: 100%;
            max-width: 600px;
            height: 220px;
            margin: 20px 0;
            position: relative;
        }

        /* 通用角色样式 */
        .character {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .character:hover {
            transform: scale(1.05);
        }

        /* 基础呼吸与等待动画 */
        @keyframes idle {
            0%, 100% { transform: translateY(0) scaleY(1); }
            50% { transform: translateY(-8px) scaleY(1.02); }
        }

        /* 欢呼跳跃动画 */
        @keyframes cheer {
            0%, 100% { transform: translateY(0) scale(1); }
            30% { transform: translateY(-45px) scale(0.9, 1.1); }
            50% { transform: translateY(-50px) rotate(10deg); }
            70% { transform: translateY(-50px) rotate(-10deg); }
            85% { transform: translateY(-10px) scale(1.05, 0.95); }
        }

        .idle-anim {
            animation: idle 3s ease-in-out infinite;
        }

        .cheer-anim {
            animation: cheer 0.8s ease-out-in !important;
        }

        /* 1号角色: 乐乐 (小男孩) */
        #boy { animation-delay: 0.2s; }
        .boy-head {
            width: 70px;
            height: 70px;
            background: #ffe0b2;
            border-radius: 50%;
            position: relative;
            border: 3px solid #333;
        }
        .boy-cap {
            position: absolute;
            top: -12px;
            left: 5px;
            width: 60px;
            height: 25px;
            background: #29b6f6;
            border-radius: 40px 40px 0 0;
            border: 3px solid #333;
        }
        .boy-cap-brim {
            position: absolute;
            top: 5px;
            left: 45px;
            width: 25px;
            height: 8px;
            background: #ffca28;
            border-radius: 0 10px 10px 0;
            border: 3px solid #333;
        }
        .face-details {
            position: relative;
            top: 25px;
            display: flex;
            justify-content: space-around;
            padding: 0 10px;
        }
        .eye {
            width: 10px;
            height: 10px;
            background: #333;
            border-radius: 50%;
        }
        .smile {
            width: 24px;
            height: 12px;
            border: 3px solid #333;
            border-top: none;
            border-radius: 0 0 20px 20px;
            margin: 12px auto 0;
        }
        .boy-body {
            width: 55px;
            height: 60px;
            background: #29b6f6;
            border-radius: 15px 15px 5px 5px;
            border: 3px solid #333;
            margin-top: -3px;
        }

        /* 2号核心IP角色: Bao (魔法小精灵) */
        #bao { animation-delay: 0s; }
        .bao-head {
            width: 85px;
            height: 80px;
            background: #ffffff;
            border-radius: 50% 50% 45% 45%;
            position: relative;
            border: 4px solid #333;
            box-shadow: inset -5px -5px 0px rgba(0,0,0,0.05);
        }
        /* 包子顶部的褶子 */
        .bao-top {
            position: absolute;
            top: -14px;
            left: 32px;
            width: 20px;
            height: 20px;
            background: #ffffff;
            border-radius: 50% 50% 0 0;
            border: 3px solid #333;
            border-bottom: none;
            transform: rotate(45deg);
        }
        .bao-blush {
            position: absolute;
            top: 40px;
            width: 14px;
            height: 8px;
            background: #ff8a80;
            border-radius: 50%;
            opacity: 0.7;
        }
        .blush-left { left: 8px; }
        .blush-right { right: 8px; }
        .bao-smile {
            width: 20px;
            height: 10px;
            border: 3.5px solid #333;
            border-top: none;
            border-radius: 0 0 15px 15px;
            margin: 30px auto 0;
        }
        .bao-body {
            width: 45px;
            height: 25px;
            background: #ffffff;
            border-radius: 10px 10px 20px 20px;
            border: 4px solid #333;
            margin-top: -5px;
        }

        /* 3号角色: 妙妙 (小女孩) */
        #girl { animation-delay: 0.4s; }
        .girl-head {
            width: 70px;
            height: 70px;
            background: #ffe0b2;
            border-radius: 50%;
            position: relative;
            border: 3px solid #333;
        }
        .hair-bun {
            position: absolute;
            width: 28px;
            height: 28px;
            background: #ec407a;
            border-radius: 50%;
            border: 3px solid #333;
            top: -8px;
        }
        .bun-left { left: -8px; }
        .bun-right { right: -8px; }
        .girl-body {
            width: 55px;
            height: 60px;
            background: #ec407a;
            border-radius: 15px 15px 5px 5px;
            border: 3px solid #333;
            margin-top: -3px;
        }

        /* 名字标签 */
        .char-name {
            background: #333;
            color: #fff;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-top: 8px;
            font-weight: bold;
        }

        /* 拼音黑板交互区 */
        .board-container {
            width: 100%;
            max-width: 750px;
            background: #8d6e63;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15), inset 0 -5px 0px rgba(0,0,0,0.2);
            border: 8px solid #a1887f;
        }

        .board {
            background: var(--board-color);
            border-radius: 12px;
            padding: 25px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            border: 3px dashed rgba(255,255,255,0.4);
        }

        /* 拼音卡片按钮 */
        .pinyin-btn {
            background: #ffffff;
            border: 3px solid #333;
            border-radius: 16px;
            padding: 20px 10px;
            font-size: 2.8rem;
            font-weight: bold;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 0px #333;
            position: relative;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .pinyin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0px #333;
            background: #fff9db;
        }

        .pinyin-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0px #333;
        }

        .pinyin-btn span.english {
            font-size: 0.9rem;
            color: #a0aec0;
            margin-top: 5px;
            font-weight: normal;
        }

        /* 动态产生的彩色漂浮气泡 */
        .bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
            border: 3px solid #333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            pointer-events: none;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            animation: floatUp 1.2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes floatUp {
            0% {
                transform: translate(-50%, 0) scale(0.5);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -150px) scale(1.2);
                opacity: 0;
            }
        }

        /* 底部版权 */
        footer {
            margin-top: 25px;
            font-size: 0.9rem;
            color: #a0aec0;
        }
    </style>
</head>
<body>

    <header>
        <h1>NihaoPlay!</h1>
        <p class="subtitle">Click the letters to play & learn Chinese Pinyin!</p>
    </header>

    <!-- 舞台区：动画儿童与Bao -->
    <div class="stage">
        <div class="character idle-anim" id="boy" onclick="makeCheer()">
            <div class="boy-head">
                <div class="boy-cap"></div>
                <div class="boy-cap-brim"></div>
                <div class="face-details">
                    <div class="eye"></div>
                    <div class="eye"></div>
                </div>
                <div class="smile"></div>
            </div>
            <div class="boy-body"></div>
            <div class="char-name">Lele</div>
        </div>

        <div class="character idle-anim" id="bao" onclick="makeCheer()">
            <div class="bao-head">
                <div class="bao-top"></div>
                <div class="bao-blush blush-left"></div>
                <div class="bao-blush blush-right"></div>
                <div class="face-details">
                    <div class="eye"></div>
                    <div class="eye"></div>
                </div>
                <div class="bao-smile"></div>
            </div>
            <div class="bao-body"></div>
            <div class="char-name">Bao</div>
        </div>

        <div class="character idle-anim" id="girl" onclick="makeCheer()">
            <div class="girl-head">
                <div class="hair-bun bun-left"></div>
                <div class="hair-bun bun-right"></div>
                <div class="face-details">
                    <div class="eye"></div>
                    <div class="eye"></div>
                </div>
                <div class="smile"></div>
            </div>
            <div class="girl-body"></div>
            <div class="char-name">Miaomiao</div>
        </div>
    </div>

    <!-- 拼音交互黑板 -->
    <div class="board-container">
        <div class="board">
            <button class="pinyin-btn" onclick="speakPinyin('ā', event)">
                ā
                <span class="english">ah</span>
            </button>
            <button class="pinyin-btn" onclick="speakPinyin('ō', event)">
                ō
                <span class="english">oh</span>
            </button>
            <button class="pinyin-btn" onclick="speakPinyin('ē', event)">
                ē
                <span class="english">uh</span>
            </button>
            <button class="pinyin-btn" onclick="speakPinyin('ī', event)">
                ī
                <span class="english">ee</span>
            </button>
            <button class="pinyin-btn" onclick="speakPinyin('ū', event)">
                ū
                <span class="english">oo</span>
            </button>
            <button class="pinyin-btn" onclick="speakPinyin('ǖ', event)">
                ǖ
                <span class="english">yu</span>
            </button>
        </div>
    </div>

    <footer>
        &copy; 2026 nihaoplay.com - All Rights Reserved.
    </footer>

    <script>
        // 发音映射表：告诉浏览器遇到带音调的字符时，应该发什么音
        const pinyinSoundMap = {
            'ā': 'a', 'ō': 'o', 'ē': 'e', 'ī': 'i', 'ū': 'u', 'ǖ': 'yu'
        };

        // 发音及互动主函数
        function speakPinyin(letter, event) {
            // 1. 调用系统浏览器语音合成发音
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                
                // 使用映射表转换，找不到对应的才使用原字符
                const sound = pinyinSoundMap[letter] || letter;
                
                const utterance = new SpeechSynthesisUtterance(sound);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.8; 
                utterance.pitch = 1.2; 
                window.speechSynthesis.speak(utterance);
            }

            // 2. 触发舞台人物欢呼动画
            makeCheer();

            // 3. 在鼠标点击位置生成彩色漂浮拼音气泡
            createBubble(letter, event.clientX, event.clientY);
        }

        // 控制所有人一起跳跃欢呼
        function makeCheer() {
            const characters = document.querySelectorAll('.character');
            characters.forEach(char => {
                // 先移除呼吸动画，加入欢呼动画
                char.classList.remove('idle-anim');
                char.classList.add('cheer-anim');

                // 动画播放完毕后(800ms)，换回呼吸动画
                setTimeout(() => {
                    char.classList.remove('cheer-anim');
                    char.classList.add('idle-anim');
                }, 800);
            });
        }

        // 生成彩色气泡的算法
        function createBubble(text, x, y) {
            const colors = ['#ff6b6b', '#4ecdc4', '#ffe0b2', '#ec407a', '#29b6f6', '#ab47bc'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];

            const bubble = document.createElement('div');
            bubble.classList.add('bubble');
            bubble.innerText = text;
            
            // 样式定制
            bubble.style.left = `${x}px`;
            bubble.style.top = `${y}px`;
            bubble.style.borderColor = randomColor;
            bubble.style.color = randomColor;
            
            // 气泡大小轻微随机化
            const size = 60 + Math.random() * 20;
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;

            document.body.appendChild(bubble);

            // 动画播放完后自动销毁 DOM 节点，避免内存泄露
            bubble.addEventListener('animationend', () => {
                bubble.remove();
            });
        }
    </script>
</body>
</html>
